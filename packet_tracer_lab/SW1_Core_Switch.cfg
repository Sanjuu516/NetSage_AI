! NetSage AI - Cisco Packet Tracer Lab Topology
! Device: Switch-1 (Cisco Catalyst 2960 Core/Trunk Switch)
! Student: Sanjana Narni | Cisco NetAcad
!

version 15.0
no service password-encryption
!
hostname Switch-1
!
vlan 10
 name Sales
!
vlan 20
 name Marketing
!
vlan 30
 name Engineering
!
vlan 40
 name Guest-Wireless
!
vlan 50
 name Server-Farm
!
! Access Ports
interface FastEthernet0/1
 description PC-A (Sales)
 switchport mode access
 switchport access vlan 10
 spanning-tree portfast
!
interface FastEthernet0/2
 description PC-B (Marketing)
 switchport mode access
 switchport access vlan 20
 spanning-tree portfast
!
interface FastEthernet0/5
 description PC-C (Engineering)
 switchport mode access
 switchport access vlan 30
 spanning-tree portfast
!
interface FastEthernet0/8
 description Office-Desk-8
 switchport mode access
 switchport access vlan 10
 switchport port-security
 switchport port-security maximum 1
 switchport port-security violation shutdown
 switchport port-security mac-address sticky
 spanning-tree portfast
!
interface FastEthernet0/24
 description Linux_Web_Server
 switchport mode access
 switchport access vlan 50
 duplex full
 speed 100
 spanning-tree portfast
!
! Trunk Port to Router-1
interface GigabitEthernet0/1
 description Uplink_to_Router1
 switchport mode trunk
 switchport trunk encapsulation dot1q
 switchport trunk native vlan 1
 switchport trunk allowed vlan 10,20,30,40,50
!
! Inter-Switch Trunk to Switch-2
interface GigabitEthernet0/2
 description Inter_Switch_Trunk_SW2
 switchport mode trunk
 switchport trunk encapsulation dot1q
 switchport trunk native vlan 1
 switchport trunk allowed vlan 1-4094
!
! DHCP Snooping
ip dhcp snooping
ip dhcp snooping vlan 10,20,30
!
interface GigabitEthernet0/1
 ip dhcp snooping trust
!
line con 0
line vty 0 15
 login
!
end
