! NetSage AI - Cisco Packet Tracer Lab Topology
! Device: Router-1 (Cisco 2911 ISR Core Router)
! Student: Sanjana Narni | Cisco NetAcad
!

version 15.4
service timestamps debug datetime msec
service timestamps log datetime msec
no service password-encryption
!
hostname Router-1
!
boot-start-marker
boot-end-marker
!
no ip domain-lookup
ip cef
!
! DHCP Pool Configuration
ip dhcp excluded-address 192.168.10.1 192.168.10.10
ip dhcp excluded-address 192.168.20.1 192.168.20.10
!
ip dhcp pool SALES_POOL
 network 192.168.10.0 255.255.255.0
 default-router 192.168.10.1
 dns-server 192.168.1.10
!
ip dhcp pool ENG_POOL
 network 192.168.20.0 255.255.255.0
 default-router 192.168.20.1
 dns-server 192.168.1.10
!
! Interface Configurations
interface GigabitEthernet0/0
 no ip address
 duplex auto
 speed auto
!
interface GigabitEthernet0/0.10
 encapsulation dot1Q 10
 ip address 192.168.10.1 255.255.255.0
 ip nat inside
!
interface GigabitEthernet0/0.20
 encapsulation dot1Q 20
 ip address 192.168.20.1 255.255.255.0
 ip nat inside
!
interface GigabitEthernet0/0.40
 encapsulation dot1Q 40
 ip address 172.16.40.1 255.255.255.0
 ip access-group GUEST_ISOLATION in
 ip nat inside
!
interface GigabitEthernet0/1
 description WAN_ISP_Interface
 ip address 203.0.113.2 255.255.255.252
 ip access-group 101 in
 ip nat outside
 duplex auto
 speed auto
!
interface GigabitEthernet0/2
 description DMZ_Server_Interface
 ip address 192.168.1.1 255.255.255.0
 ip nat inside
 duplex auto
 speed auto
!
! Dynamic NAT Overload (PAT)
ip nat inside source list 1 interface GigabitEthernet0/1 overload
!
! Access Control Lists
access-list 1 permit 192.168.10.0 0.0.0.255
access-list 1 permit 192.168.20.0 0.0.0.255
!
! Extended ACL 101 - Perimeter Firewall (Remediated State)
ip access-list extended 101
 permit icmp any any
 20 permit tcp any host 192.168.1.100 eq www
 permit ip any any
!
! Guest Wi-Fi Isolation ACL
ip access-list extended GUEST_ISOLATION
 permit udp any any eq bootps
 permit udp any any eq domain
 deny ip 172.16.40.0 0.0.0.255 10.0.0.0 0.255.255.255
 permit ip 172.16.40.0 0.0.0.255 any
!
! Routing Configuration
ip route 0.0.0.0 0.0.0.0 203.0.113.1
!
router ospf 1
 router-id 1.1.1.1
 network 192.168.10.0 0.0.0.255 area 0
 network 192.168.20.0 0.0.0.255 area 0
 network 203.0.113.0 0.0.0.3 area 0
 passive-interface GigabitEthernet0/0.40
!
line con 0
 linevty 0 4
 login
!
end
